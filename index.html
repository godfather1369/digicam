<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#15171b">
<title>DigiCam</title>
<style>
:root{--hud:#f2f7ff;--acc:#2f7bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;background:radial-gradient(#2a2d33,#111215);font-family:"Trebuchet MS",Verdana,sans-serif;color:#111;overflow:hidden}
body{display:flex;justify-content:center;align-items:center}
button{font:inherit;cursor:pointer;border:0;color:#1a1c20;touch-action:manipulation}
/* ---- camera body: brushed silver ---- */
.cam{position:relative;width:min(100vw,460px);height:min(100vh,100dvh,940px);padding:8px 10px 10px;display:flex;flex-direction:column;gap:7px;border-radius:28px;
 background:repeating-linear-gradient(90deg,rgba(255,255,255,.09) 0 1px,transparent 1px 3px),linear-gradient(135deg,#e3e5ea,#a3a7af 40%,#d0d3d9 62%,#868a92);
 box-shadow:inset 0 2px 0 #fffc,inset 0 -3px 0 #5557,0 14px 50px #000c;border:1px solid #fff6}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-style:italic;font-size:19px;letter-spacing:1px;color:#23262c;text-shadow:0 1px 0 #fff9}
.mp{font-size:9px;font-weight:700;color:#3b3f47;text-align:right;line-height:1.3}
.led{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3c3;box-shadow:0 0 6px #3c3;margin-right:5px;vertical-align:middle}
.main{flex:1;min-height:0;display:flex;justify-content:center}
.lcd{position:relative;flex:none;height:100%;aspect-ratio:3/4;max-width:100%;margin:0 auto;min-width:0;background:#000;border-radius:10px;border:4px solid #1d1f24;box-shadow:0 0 0 2px #7d818a,inset 0 0 18px #000;overflow:hidden}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.1),transparent 35%)}
canvas#view{width:100%;height:100%;display:block;object-fit:contain;background:#000}
/* ---- LCD HUD ---- */
.hud{position:absolute;inset:0;pointer-events:none;color:var(--hud);font:600 clamp(9px,2.6vw,12px)/1.2 "Courier New",monospace;text-shadow:0 0 3px #000,0 0 2px #000;z-index:2}
.hud>div{position:absolute;display:flex;gap:7px;align-items:center}
.h-tl{left:8px;top:7px}.h-tr{right:8px;top:7px}.h-bl{left:8px;bottom:7px}.h-br{right:8px;bottom:7px}
.h-bc{left:50%;bottom:7px;transform:translateX(-50%)}
.zbar{display:inline-block;width:60px;height:5px;border:1px solid #fff;position:relative}.zbar i{position:absolute;left:0;top:0;bottom:0;background:#fff;width:0}
.batt{display:inline-block;width:20px;height:9px;border:1px solid #fff;position:relative;padding:1px}.batt::before{content:"";display:block;height:100%;width:75%;background:#7f7}
.focus{position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;z-index:2}
.focus i{position:absolute;width:16%;height:16%;border:2px solid #fffc;transition:border-color .15s}
.focus i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.focus i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.focus i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.focus i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.focus.ok i{border-color:#4f4}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;background:#0009;color:#fff;padding:8px 16px;border-radius:6px;font:700 clamp(14px,4.5vw,22px) "Trebuchet MS",sans-serif;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font:900 90px "Trebuchet MS";color:#fff;text-shadow:0 0 12px #000;z-index:3;pointer-events:none}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
.flash.go{animation:fl .3s}@keyframes fl{from{opacity:.95}to{opacity:0}}
@media (prefers-reduced-motion:reduce){.flash.go{animation:none}}
/* ---- on-LCD menu ---- */
.menu{position:absolute;inset:0;background:linear-gradient(#0c2a63ee,#07163aee);z-index:5;display:none;flex-direction:column;color:#fff;font-family:"Trebuchet MS",sans-serif}
.menu.on{display:flex}
.menu h4{margin:0;padding:8px 12px;font-size:13px;letter-spacing:1px;background:#1b4aa8;text-transform:uppercase}
.menu ul{list-style:none;margin:0;padding:4px;overflow:auto;flex:1}
.menu li{padding:9px 12px;font-size:15px;border-radius:4px;display:flex;justify-content:space-between;cursor:pointer}
.menu li.sel{background:#ffd23c;color:#1a1400;font-weight:700}
/* ---- controls ---- */
.side{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:8px 10px}
.side .dpad{grid-column:1;grid-row:1;justify-self:center}
.side .shutrow{grid-column:2;grid-row:1;flex-direction:column;gap:14px}
.side .btns{grid-column:1/-1;grid-row:2}
.shutrow{display:flex;align-items:center;justify-content:space-between;width:100%;gap:12px}
.shutter{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9d8f,#d9301c 55%,#7e1308);box-shadow:0 4px 0 #4a0c05,0 0 0 6px #0003,inset 0 2px 3px #fff8}
.shutter:active{transform:translateY(2px);box-shadow:0 2px 0 #4a0c05,0 0 0 6px #0003}
.zoom{display:flex;border-radius:30px;overflow:hidden;box-shadow:0 2px 0 #555,inset 0 1px #fff}
.zoom button{padding:14px 18px;background:linear-gradient(#f2f3f5,#bfc3ca);font-weight:900;font-size:15px}
.zoom button+button{border-left:1px solid #777}
.dpad{position:relative;width:min(140px,19vh);height:min(140px,19vh);border-radius:50%;background:radial-gradient(circle,#f3f4f6 0 38%,#b4b8c0 39%,#d9dce1 70%,#8d9199);box-shadow:0 3px 0 #555,inset 0 2px 3px #fff}
.dpad button{position:absolute;background:none;font-weight:900;font-size:16px;width:34%;height:34%;color:#333}
.dpad .u{left:33%;top:3%}.dpad .d{left:33%;bottom:3%}.dpad .l{left:3%;top:33%}.dpad .r{right:3%;top:33%}
.dpad .ok{left:31%;top:31%;width:38%;height:38%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#c3c7ce);box-shadow:0 1px 3px #0006;font-size:10px}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:100%}
.pill{background:linear-gradient(#f4f5f7,#c4c8ce);border-radius:16px;padding:8px 4px;font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;box-shadow:0 2px 0 #6f737b,inset 0 1px #fff}
.pill:active{transform:translateY(1px)}
.pill.on{background:linear-gradient(#ffe38a,#e6b629)}
.mode{display:flex;border-radius:14px;overflow:hidden;box-shadow:0 2px 0 #555,inset 0 1px #fff}
.mode button{padding:6px 11px;font-size:10px;font-weight:900;letter-spacing:.6px;background:linear-gradient(#f2f3f5,#bfc3ca)}
.mode button.on{background:linear-gradient(#ff8a7a,#d9301c);color:#fff}
.h-tc{left:50%;top:7px;transform:translateX(-50%)}
#hRec{color:#ff5b5b;font-weight:900}
.shutter.rec{animation:pulse 1s infinite;border-radius:22%}
@keyframes pulse{50%{box-shadow:0 4px 0 #4a0c05,0 0 0 10px #ff3b2a55}}
@media (prefers-reduced-motion:reduce){.shutter.rec{animation:none}}
.stage{position:relative;display:flex;justify-content:center;align-items:center;width:min(100%,640px)}
#big,#bigv{max-width:100%;max-height:64vh;border-radius:6px;background:#000}
#bigv{display:none}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;background:#000a;color:#fff;font-size:36px;border-radius:8px;line-height:1}
.nav.l{left:4px}.nav.r{right:4px}
#vCount{font-size:13px;color:#c8ccd4}
.th{position:relative;aspect-ratio:1;cursor:pointer;background:#222;border-radius:4px;overflow:hidden}
.th img,.th video{width:100%;height:100%;object-fit:cover;display:block}
.th span{position:absolute;right:5px;bottom:4px;color:#fff;font-size:13px;text-shadow:0 0 4px #000}
@media (orientation:landscape) and (min-width:560px){
 .cam{width:min(98vw,calc(98vh*1.72),980px);height:auto;aspect-ratio:1.72;flex-direction:row;flex-wrap:wrap;align-content:flex-start;padding:2% 2.4%;gap:2.5%;border-radius:3% / 5%}
 .top{position:absolute;left:3%;top:2%;right:3%}
 .lcd{flex:1;height:auto;aspect-ratio:auto;margin:0}
 .main{flex:none;width:70%;aspect-ratio:4/3;margin-top:5.5%;align-self:flex-start}
 .side{display:flex;flex-direction:column;flex:1;margin-top:5.5%;justify-content:space-between;align-self:stretch;padding-bottom:1%}
 .side .shutrow{flex-direction:row-reverse;gap:12px}
 .dpad{width:min(36%,20vh);height:auto;aspect-ratio:1;min-width:92px}
}
@media (orientation:landscape) and (max-width:559px){.cam{width:100vw}}
/* ---- overlay screens ---- */
.screen{position:fixed;inset:0;background:#14161aee;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:9;color:#fff;text-align:center;gap:12px}
.screen.on{display:flex}
.screen input{font-size:24px;text-align:center;width:200px;padding:10px;border-radius:10px;border:2px solid var(--acc);background:#000;color:#fff;letter-spacing:6px}
.screen p{max-width:320px;font-size:14px;margin:0;color:#c8ccd4}
#err{color:#ff8a8a;min-height:18px;font-size:13px}
#gal{justify-content:flex-start;overflow:auto;padding-top:calc(20px + env(safe-area-inset-top))}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(100%,520px)}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;cursor:pointer;background:#222}

.row{display:flex;gap:8px;justify-content:center}
.screen .pill{padding:11px 16px;font-size:12px;width:auto}
</style>
</head>
<body>
<div class="cam" id="cam">
  <div class="top"><span class="logo">DigiCam</span><div class="mode" id="modeSw"><button id="mPhoto" class="on">PHOTO</button><button id="mVideo">VIDEO</button></div><span class="mp"><i class="led"></i>12.1 MEGA PIXELS<br>OPTICAL ZOOM LENS</span></div>
  <div class="main">
    <div class="lcd" id="lcd">
      <canvas id="view" width="480" height="640"></canvas>
      <div class="focus" id="focus"><i></i><i></i><i></i><i></i></div>
      <div class="hud" id="hud">
        <div class="h-tl"><span id="hMode">P</span><span>12M</span><span id="hFx">NORMAL</span></div>
        <div class="h-tc"><span id="hRec"></span></div>
        <div class="h-tr"><span id="hShots">0000</span><span class="batt"></span></div>
        <div class="h-bl"><span id="hTimer"></span><span id="hFlash">⚡AUTO</span></div>
        <div class="h-bc">W<span class="zbar"><i id="zfill"></i></span>T <span id="zval">1.0x</span></div>
        <div class="h-br"><span id="hSize">3:4</span></div>
      </div>
      <div class="toast" id="toastEl"></div>
      <div class="count" id="cdown"></div>
      <div class="flash" id="flash"></div>
      <div class="menu" id="menu"><h4>Effect / Scene</h4><ul id="menuList"></ul></div>
    </div>
  </div>
  <div class="side">
    <div class="shutrow">
      <button class="shutter" id="shot" aria-label="Shutter"></button>
      <div class="zoom"><button id="zw" aria-label="Zoom out">W</button><button id="zt" aria-label="Zoom in">T</button></div>
    </div>
    <div class="dpad">
      <button class="u" id="zin" aria-label="Zoom in">▲</button><button class="d" id="zout" aria-label="Zoom out">▼</button>
      <button class="l" id="prev" aria-label="Previous effect">◀</button><button class="r" id="next" aria-label="Next effect">▶</button>
      <button class="ok" id="ok">OK</button>
    </div>
    <div class="btns">
      <button class="pill" id="menuBtn">Menu</button>
      <button class="pill" id="openGal">▶ Play</button>
      <button class="pill" id="timerBtn">Timer: off</button>
      <button class="pill" id="dispBtn">Disp</button>
      <button class="pill" id="flip">Flip cam</button>
      <button class="pill on" id="stampBtn">Date: on</button>
    </div>
  </div>
</div>

<div class="screen on" id="lock">
  <h2 id="lockTitle">DigiCam</h2>
  <p id="lockMsg"></p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="PIN">
  <input id="pin2" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="Repeat PIN" style="display:none">
  <div id="err"></div>
  <button class="pill" id="unlock">Continue</button>
</div>
<div class="screen" id="gal">
  <div class="row"><button class="pill" id="closeGal">Back to camera</button></div>
  <div class="grid" id="grid"></div>
  <p id="empty" style="display:none">No photos yet. Take one with the shutter button.</p>
</div>
<div class="screen" id="viewer">
  <div class="stage" id="stage">
    <img id="big" alt="Selected photo"><video id="bigv" controls playsinline></video>
    <button class="nav l" id="vPrev" aria-label="Previous">‹</button><button class="nav r" id="vNext" aria-label="Next">›</button>
  </div>
  <div id="vCount"></div>
  <div class="row">
    <button class="pill" id="vBack">Close</button>
    <button class="pill" id="vSave">Save copy</button>
    <button class="pill" id="vDel">Delete</button>
  </div>
</div>
<video id="vid" playsinline muted style="display:none"></video>
<script>
"use strict";
const $=id=>document.getElementById(id);
const enc=new TextEncoder(),dec=new TextDecoder();
/* ---------- Private encrypted storage (IndexedDB + AES-GCM, key from PIN) ---------- */
let db,key;
const idb=()=>new Promise((res,rej)=>{
  const r=indexedDB.open("digicam-private",1);
  r.onupgradeneeded=()=>{r.result.createObjectStore("meta");r.result.createObjectStore("shots",{keyPath:"id",autoIncrement:true});};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
});
const tx=(s,m="readonly")=>db.transaction(s,m).objectStore(s);
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
async function derive(pin,salt){
  const base=await crypto.subtle.importKey("raw",enc.encode(pin),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function seal(bytes){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  return {iv,data:await crypto.subtle.encrypt({name:"AES-GCM",iv},key,bytes)};
}
const open=o=>crypto.subtle.decrypt({name:"AES-GCM",iv:o.iv},key,o.data);


/* ---------- Effects ---------- */
const FX=[
 {id:"normal",name:"Normal"},{id:"super8",name:"Super 8"},{id:"vhs",name:"VHS"},{id:"mm8",name:"8mm"},
 {id:"kodak",name:"Kodak"},{id:"vcr",name:"VCR"},{id:"disposable",name:"Disposable"},{id:"fling35",name:"Fling 35"},
 {id:"gold",name:"Kodak Gold"},{id:"klasse",name:"Klasse"},{id:"polaroid",name:"Polaroid"},{id:"stop",name:"Stop Motion"},
 {id:"subs",name:"Subtitles"},{id:"warp",name:"Warp Frame"},{id:"vintage",name:"Vintage Effect"},{id:"super16",name:"Super 16"},
 {id:"prima",name:"Prima Film"},{id:"handycam",name:"Handycam"}
];
// colour recipes: contrast, saturation, channel gains, black lift, fade, grain
const P={
 super8:{con:1.12,sat:.8,r:1.16,g:1,b:.72,lift:16,fade:.14,grain:42,soft:.8,tint:[10,2,-6,6,3,-4]},
 vhs:{con:1.08,sat:1.5,r:1,g:1,b:1.08,lift:10,fade:.1,grain:34,soft:.55,ca:.012},
 mm8:{con:1.22,sat:.3,r:1.18,g:1.02,b:.7,lift:12,fade:.14,grain:50,soft:.7},
 kodak:{con:1.12,sat:1.25,r:1.1,g:1,b:.86,lift:6,fade:.05,grain:16,tint:[-4,2,6,10,4,-6]},
 vcr:{con:1.02,sat:1.1,r:.9,g:1.02,b:1.2,lift:14,fade:.14,grain:40,soft:.5,ca:.014},
 disposable:{con:1.32,sat:1.25,r:1.05,g:1.03,b:.92,lift:4,fade:.02,grain:26,ca:.002},
 fling35:{con:1.14,sat:.88,r:1.06,g:1,b:.9,lift:8,fade:.1,grain:30,soft:.9,ca:.003,tint:[0,4,6,8,2,-4]},
 gold:{con:1.14,sat:1.32,r:1.22,g:1.08,b:.66,lift:12,fade:.06,grain:18},
 klasse:{con:1.24,sat:1.28,r:.94,g:1.06,b:1.05,lift:2,fade:0,grain:10,tint:[-6,6,10,6,0,-6]},
 polaroid:{con:.96,sat:.85,r:1.06,g:1.02,b:.88,lift:26,fade:.2,grain:22,soft:.92,tint:[-4,8,12,10,4,-6]},
 stop:{con:1.2,sat:1.25,r:1.03,g:1,b:.94,lift:4,fade:.04,grain:14},
 subs:{con:1.15,sat:.8,r:1.04,g:1,b:1.06,lift:6,fade:.06,grain:12,tint:[-6,2,10,12,4,-8]},
 warp:{con:1.1,sat:1.35,r:1,g:1,b:1.05,lift:0,fade:0,grain:8,ca:.008},
 vintage:{con:1.2,sat:1.15,r:.95,g:1.02,b:1.12,lift:12,fade:.06,grain:30,soft:.8,ca:.004},
 super16:{con:1.2,sat:1.1,r:1.1,g:1,b:.82,lift:8,fade:.08,grain:30,soft:.85,tint:[-4,4,10,8,2,-6]},
 prima:{con:1.22,sat:1.18,r:1.08,g:.99,b:.95,lift:6,fade:.04,grain:20,soft:.9,ca:.0015},
 handycam:{con:.95,sat:1.2,r:1,g:1.02,b:1.03,lift:12,fade:.1,grain:22,soft:.75,ca:.003}
};
const NT=new Float32Array(8192);for(let i=0;i<8192;i++)NT[i]=Math.random()-.5;
const cl=v=>v<0?0:v>255?255:v;
const softC=document.createElement("canvas");
function softPass(ctx,w,h,f){ // lens/tape softness: shrink then scale back up
  softC.width=Math.max(8,Math.round(w*f));softC.height=Math.max(8,Math.round(h*f));
  softC.getContext("2d").drawImage(ctx.canvas,0,0,softC.width,softC.height);
  ctx.imageSmoothingEnabled=true;ctx.drawImage(softC,0,0,w,h);
}
function grade(ctx,w,h,k){
  if(k.soft)softPass(ctx,w,h,k.soft);
  const im=ctx.getImageData(0,0,w,h),d=im.data,len=d.length,off=(Math.random()*8192)|0,keep=1-k.fade,T=k.tint;
  const ca=k.ca?Math.max(1,Math.round(k.ca*w))*4:0,src=ca?new Uint8ClampedArray(d):d;let j=off;
  for(let i=0;i<len;i+=4){
    let rr=src[i],bb=src[i+2];
    if(ca){const ri=i+ca,bi=i-ca;rr=src[ri<len?ri:i];bb=src[bi>=0?bi:i+2];if(bi>=0)bb=src[bi+2];}
    let r=(rr*k.r-128)*k.con+128,g=(d[i+1]*k.g-128)*k.con+128,b=(bb*k.b-128)*k.con+128;
    const l=.299*r+.587*g+.114*b;
    r=l+(r-l)*k.sat;g=l+(g-l)*k.sat;b=l+(b-l)*k.sat;
    if(T){const t=l/255,a=1-t;r+=T[0]*a+T[3]*t;g+=T[1]*a+T[4]*t;b+=T[2]*a+T[5]*t;}
    const n=NT[j++&8191]*k.grain;
    d[i]=cl(r*keep+k.lift+n);d[i+1]=cl(g*keep+k.lift+n);d[i+2]=cl(b*keep+k.lift+n);
  }
  ctx.putImageData(im,0,0);
}
const tmpC=document.createElement("canvas");
function bloom(ctx,w,h,a,tint){
  tmpC.width=Math.max(8,w>>4);tmpC.height=Math.max(8,h>>4);
  const tc=tmpC.getContext("2d");tc.drawImage(ctx.canvas,0,0,tmpC.width,tmpC.height);
  if(tint){tc.globalCompositeOperation="multiply";tc.fillStyle=tint;tc.fillRect(0,0,tmpC.width,tmpC.height);tc.globalCompositeOperation="source-over";}
  ctx.save();ctx.globalCompositeOperation="screen";ctx.globalAlpha=a;ctx.imageSmoothingEnabled=true;
  ctx.drawImage(tmpC,0,0,w,h);ctx.restore();
}
function vig(ctx,w,h,a){
  const g=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*.3,w/2,h/2,Math.max(w,h)*.75);
  g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,`rgba(0,0,0,${a})`);
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
}
function flashFall(ctx,w,h){ // on-camera flash: bright centre, dark corners
  ctx.save();ctx.globalCompositeOperation="screen";
  const g=ctx.createRadialGradient(w/2,h*.48,0,w/2,h*.48,Math.max(w,h)*.55);
  g.addColorStop(0,"rgba(255,245,225,.28)");g.addColorStop(1,"rgba(255,245,225,0)");
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.restore();vig(ctx,w,h,.55);
}
function dirt(ctx,w,h,n,scr){
